[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-devops-lab"
version = "0.1.0"
description = "Executable Linux and network operations controls"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
resolver-audit = "resolver_audit:main"

[tool.setuptools]
py-modules = ["resolver_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
