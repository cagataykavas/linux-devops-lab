name: Link health audit

on:
  pull_request:
    paths:
      - "link_health_audit.py"
      - "tests/test_link_health_audit.py"
      - "examples/link_health_policy.json"
      - ".github/workflows/link-health-audit.yml"
  push:
    branches: [main]
    paths:
      - "link_health_audit.py"
      - "tests/test_link_health_audit.py"
      - "examples/link_health_policy.json"
      - ".github/workflows/link-health-audit.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.10
      - run: ruff check link_health_audit.py tests/test_link_health_audit.py
      - run: ruff format --check link_health_audit.py tests/test_link_health_audit.py
      - run: python -m compileall -q link_health_audit.py tests/test_link_health_audit.py
      - run: python -m unittest discover -s tests -p 'test_link_health_audit.py' -v
      - run: python link_health_audit.py --help
      - name: Sample the runner network namespace
        run: >-
          python link_health_audit.py
          --policy examples/link_health_policy.json
          --report "$RUNNER_TEMP/link-health.json"
          --interval 1
