name: listener-audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.3
      - run: ruff check listener_audit.py tests/test_listener_audit.py
      - run: ruff format --check listener_audit.py tests/test_listener_audit.py
      - run: python -m unittest discover -s tests -p 'test_listener_audit.py' -v
      - run: python -m compileall -q listener_audit.py tests/test_listener_audit.py
      - run: python listener_audit.py --help
