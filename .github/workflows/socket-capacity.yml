name: socket-capacity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest==8.4.2 ruff==0.16.9
      - run: ruff check --isolated --line-length 100 --select B,E,F,I,UP socket_capacity.py tests/test_socket_capacity.py
      - run: ruff format --isolated --line-length 100 --check socket_capacity.py tests/test_socket_capacity.py
      - run: python -m pytest -q
      - run: python -m compileall -q socket_capacity.py tests
